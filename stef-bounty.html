
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mug targets</title>
<style>
  :root {
    --bg: #12131a;
    --panel: #1a1c25;
    --line: #2c2f3c;
    --text: #dfe2ec;
    --dim: #7d839a;
    --accent: #c8a24a;
    --ok: #6fbf73;
    --bad: #d05c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 {
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 16px;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px;
    border-radius: 4px;
  }
  input, button {
    font: inherit;
    background: #0e0f15;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 10px;
  }
  input:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #key { flex: 1 1 260px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #pages { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  label { color: var(--dim); font-size: 12px; }
  button {
    background: var(--accent);
    color: #16171d;
    border-color: var(--accent);
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin: 12px 2px; font-size: 12px; color: var(--dim); min-height: 16px; font-variant-numeric: tabular-nums; }
  #status.err { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  th[data-dir="asc"]::after { content: " \25B2"; color: var(--accent); }
  th[data-dir="desc"]::after { content: " \25BC"; color: var(--accent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }
  tbody tr:hover { background: #191b24; }
  a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
  a:hover { border-color: var(--accent); }
  .idle { color: var(--dim); }
  .online { color: var(--ok); }
  .pending { color: #3d4152; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mug targets</h1>

  <div class="bar">
    <input id="key" type="password" placeholder="Full access API key" autocomplete="off" spellcheck="false">
    <label for="pages">Log pages</label>
    <input id="pages" type="number" min="1" max="50" value="5">
    <button id="run">Run</button>
  </div>

  <div id="status"></div>

  <table id="tbl" hidden>
    <thead>
      <tr>
        <th data-k="id" class="n">ID</th>
        <th data-k="name">Name</th>
        <th data-k="mugs" class="n">Mugs</th>
        <th data-k="total" class="n">Mugged</th>
        <th data-k="last" class="n">Last mug</th>
        <th data-k="networth" class="n">Networth</th>
        <th data-k="lastAction" class="n">Last action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const MUG_LOG = 8155;
const GAP = 700;

const $ = s => document.querySelector(s);
const keyEl = $('#key'), pagesEl = $('#pages'), runEl = $('#run');
const statusEl = $('#status'), tbl = $('#tbl'), tbody = tbl.querySelector('tbody');

let rows = [];
let sortKey = 'networth', sortDir = 'desc';
let running = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const nf = n => n == null ? '' : n.toLocaleString('en-GB');

function money(n) {
  if (n == null) return '';
  return '$' + n.toLocaleString('en-GB');
}

function ago(ts) {
  if (!ts) return '';
  let s = Math.floor(Date.now() / 1000) - ts;
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function setStatus(text, isErr) {
  statusEl.textContent = text;
  statusEl.classList.toggle('err', !!isErr);
}

class ApiError extends Error {
  constructor(code, msg) { super(msg); this.code = code; }
}

async function api(params, id) {
  const url = new URL('https://api.torn.com/user/' + (id ?? ''));
  for (const [k, v] of Object.entries(params)) {
    if (v !== null && v !== undefined) url.searchParams.set(k, v);
  }
  url.searchParams.set('key', keyEl.value.trim());
  url.searchParams.set('comment', 'MugTargets');

  for (let attempt = 0; attempt < 3; attempt++) {
    const res = await fetch(url);
    const json = await res.json();
    if (!json.error) return json;
    if (json.error.code === 5) { await sleep(6000); continue; }
    throw new ApiError(json.error.code, json.error.error);
  }
  throw new ApiError(5, 'Too many requests');
}

async function pullLogs(pages) {
  const out = [];
  let to = null;
  for (let p = 0; p < pages; p++) {
    setStatus('Reading log page ' + (p + 1) + ' of ' + pages);
    const json = await api({ selections: 'log', log: MUG_LOG, to });
    const batch = Object.values(json.log || {});
    if (!batch.length) break;
    out.push(...batch);
    const oldest = Math.min(...batch.map(e => e.timestamp));
    to = oldest - 1;
    if (batch.length < 100) break;
    await sleep(GAP);
  }
  return out;
}

function aggregate(entries) {
  const map = new Map();
  for (const e of entries) {
    const d = e.data || {};
    if (d.anonymous) continue;
    const id = d.defender;
    if (!id) continue;
    let r = map.get(id);
    if (!r) {
      r = { id, name: null, mugs: 0, total: 0, last: 0, networth: null, lastAction: null, rel: null, state: null };
      map.set(id, r);
    }
    r.mugs++;
    r.total += d.money_mugged || 0;
    if (e.timestamp > r.last) r.last = e.timestamp;
  }
  return [...map.values()];
}

function cmp(a, b) {
  const av = a[sortKey], bv = b[sortKey];
  if (av == null && bv == null) return 0;
  if (av == null) return 1;
  if (bv == null) return -1;
  if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  return sortDir === 'asc' ? av - bv : bv - av;
}

function render() {
  rows.sort(cmp);
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement('tr');
    const cls = r.state === 'Online' ? 'online' : r.state === 'Idle' ? 'idle' : '';
    tr.innerHTML =
      '<td class="num">' + r.id + '</td>' +
      '<td><a href="https://www.torn.com/profiles.php?XID=' + r.id + '" target="_blank" rel="noopener">' +
        (r.name || '<span class="pending">…</span>') + '</a></td>' +
      '<td class="num">' + r.mugs + '</td>' +
      '<td class="num">' + money(r.total) + '</td>' +
      '<td class="num">' + ago(r.last) + '</td>' +
      '<td class="num">' + (r.networth == null ? '<span class="pending">…</span>' : money(r.networth)) + '</td>' +
      '<td class="num ' + cls + '">' + (r.lastAction == null ? '<span class="pending">…</span>' : ago(r.lastAction)) + '</td>';
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
  tbl.hidden = rows.length === 0;
}

async function enrich() {
  let done = 0;
  for (const r of rows) {
    try {
      const json = await api({ selections: 'profile,personalstats', stat: 'networth' }, r.id);
      r.name = json.name || String(r.id);
      r.networth = json.personalstats ? (json.personalstats.networth ?? null) : null;
      if (json.last_action) {
        r.lastAction = json.last_action.timestamp;
        r.state = json.last_action.status;
      }
    } catch (err) {
      r.name = 'error ' + (err.code ?? '');
    }
    done++;
    setStatus('Profiles ' + done + ' of ' + rows.length);
    render();
    if (done < rows.length) await sleep(GAP);
  }
}

async function run() {
  if (running) return;
  if (!keyEl.value.trim()) { setStatus('Enter an API key', true); return; }

  running = true;
  runEl.disabled = true;
  rows = [];
  render();

  try {
    const pages = Math.max(1, Math.min(50, parseInt(pagesEl.value, 10) || 1));
    const entries = await pullLogs(pages);
    rows = aggregate(entries);
    render();
    if (!rows.length) { setStatus('No mug entries found'); return; }
    await sleep(GAP);
    await enrich();
    setStatus(rows.length + ' targets from ' + entries.length + ' mugs');
  } catch (err) {
    setStatus('API error ' + (err.code ?? '') + ': ' + err.message, true);
  } finally {
    running = false;
    runEl.disabled = false;
  }
}

document.querySelectorAll('th').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = k; sortDir = th.classList.contains('n') ? 'desc' : 'asc'; }
    document.querySelectorAll('th').forEach(o => o.removeAttribute('data-dir'));
    th.dataset.dir = sortDir;
    render();
  });
});

runEl.addEventListener('click', run);
keyEl.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
