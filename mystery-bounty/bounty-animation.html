<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mystery Bounty — Table Replay</title>
  <style>
    :root {
      --bg: #12160f;
      --card: #202a1e;
      --card2: #26331f;
      --line: #3a4a33;
      --text: #e8eadf;
      --dim: #9aa88f;
      --gold: #e3b341;
      --green: #7ccb6e;
      --red: #e06c5c;
      --chip: #2f4d33;
      --felt: #1c3a22;
      --felt2: #163019;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 50% -20%, #23331f 0%, var(--bg) 60%);
      color: var(--text);
      font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 22px 16px 40px;
    }

    .wrap { max-width: 1180px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .brand .suit { color: var(--red); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ---- table felt + seats ---- */
    .tablecard {
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
    }

    .table-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .table-meta .tname { font-weight: 700; letter-spacing: .5px; }
    .table-meta .tname span { color: var(--gold); }
    .tag {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 10px; border-radius: 999px;
      background: var(--chip); color: var(--green); border: 1px solid var(--line);
    }

    .felt-wrap {
      position: relative;
      width: 100%;
      /* keep an oval aspect */
      padding-top: 58%;
    }

    .felt {
      position: absolute;
      inset: 11% 7%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 38%, var(--felt) 0%, var(--felt2) 78%);
      border: 6px solid #0e1a0f;
      box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.4);
    }
    .felt::after {
      content: "";
      position: absolute; inset: 14px;
      border-radius: 50%;
      border: 1px dashed rgba(227,179,65,.22);
    }

    .felt-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; pointer-events: none;
    }
    .felt-center .pot-label {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim);
    }
    .felt-center .pot-amt { font-size: 30px; font-weight: 800; color: var(--gold); }
    .felt-center .pot-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

    /* seats positioned via JS (left/top %) */
    .seat {
      position: absolute;
      width: 118px;
      transform: translate(-50%, -50%);
      transition: opacity .4s ease, filter .4s ease;
    }
    .seat .avatar {
      width: 48px; height: 48px; margin: 0 auto 5px;
      border-radius: 50%;
      background: var(--chip);
      border: 2px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 17px; color: var(--text);
      position: relative;
      transition: border-color .3s ease, transform .3s ease;
    }
    .seat .nameplate {
      background: rgba(13,18,11,.82);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px 8px;
      text-align: center;
      backdrop-filter: blur(2px);
    }
    .seat .pname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seat .pbounty {
      font-size: 11px; color: var(--gold); min-height: 14px;
      font-variant-numeric: tabular-nums;
    }
    .seat .pbounty.empty { color: var(--dim); }

    /* busted state */
    .seat.out { opacity: .4; filter: grayscale(.6); }
    .seat.out .avatar { border-color: var(--red); }
    .seat .xmark {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      color: var(--red); font-size: 42px; font-weight: 900; line-height: 1;
      pointer-events: none;
    }
    .seat.out .xmark { display: flex; animation: xpop .45s cubic-bezier(.2,1.4,.4,1); }
    @keyframes xpop {
      0% { transform: scale(2.4) rotate(-20deg); opacity: 0; }
      60% { transform: scale(.8) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* survivor / winner badges */
    .seat .badge {
      position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      display: none;
    }
    .seat.advance .badge.adv { display: block; background: var(--greenbg, #1d3328); color: var(--green); border: 1px solid var(--green); }
    .seat.winner .badge.win { display: block; background: var(--goldbg, #3a2f14); color: var(--gold); border: 1px solid var(--gold); }
    .seat.winner .avatar { border-color: var(--gold); transform: scale(1.08); }
    .seat .badge.adv, .seat .badge.win { background: #1d3328; }

    /* ---- envelope ---- */
    .envelope {
      position: absolute;
      width: 56px; height: 38px;
      transform: translate(-50%, -50%) scale(.2);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: left .45s ease, top .45s ease;
    }
    .envelope.show { animation: envIn .9s forwards cubic-bezier(.2,1.2,.4,1); }
    @keyframes envIn {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-12deg); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
    }
    .env-body {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #f0dba0, #d9b65a);
      border: 1px solid #b4902f;
      border-radius: 5px;
      box-shadow: 0 6px 16px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .env-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 60%;
      background: linear-gradient(160deg, #e8cf8c, #cBa445);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 1.6s cubic-bezier(.3,.7,.3,1);
      z-index: 2;
    }
    .envelope.open .env-flap { transform: rotateX(180deg); }
    .env-amt {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(.3);
      white-space: nowrap;
      font-weight: 800; font-size: 15px; color: #241d07;
      opacity: 0; transition: opacity .9s ease 1.25s, transform .9s cubic-bezier(.2,1.4,.4,1) 1.25s;
      z-index: 1;
    }
    .envelope.open .env-amt { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* floating "+$X" that flies to the leaderboard feel */
    .floataward {
      position: absolute; z-index: 30;
      transform: translate(-50%, -50%);
      font-weight: 800; color: var(--gold);
      font-size: 16px; pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.6);
      opacity: 0;
    }
    .floataward.go { animation: floatUp 1.1s forwards ease-out; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-180%) scale(1.1); }
    }

    /* ---- replay button (only shows once the replay ends) ---- */
    .replaybar {
      margin-top: 16px;
      display: flex; justify-content: center;
      min-height: 42px;
    }
    .btn {
      background: var(--gold); color: #241d07; border: 0;
      font-weight: 700; font-size: 14px;
      padding: 10px 22px; border-radius: 999px; cursor: pointer;
      transition: opacity .3s ease;
    }
    .btn[hidden] { display: none; }

    /* ---- side: leaderboard ---- */
    .side { display: flex; flex-direction: column; gap: 18px; }
    .panel {
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .panel h3 {
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--dim); margin-bottom: 10px; font-weight: 700;
    }
    .lb-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid var(--line);
      transition: background .3s ease;
    }
    .lb-row:last-child { border-bottom: 0; }
    .lb-row .rank { width: 18px; color: var(--dim); font-size: 13px; font-weight: 700; }
    .lb-row .av {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--chip); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .lb-row .nm { flex: 1; font-size: 14px; }
    .lb-row .ko-count { font-size: 11px; color: var(--dim); }
    .lb-row .cash { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
    .lb-row.bump { background: rgba(227,179,65,.10); }

    .poolrow { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; }
    .poolrow span:last-child { color: var(--gold); font-weight: 700; }
    .note { color: var(--dim); font-size: 12px; margin-top: 8px; }

    /* ---- mobile ---- */
    @media (max-width: 640px) {
      body { padding: 14px 10px 30px; overflow-x: hidden; }
      .brand { font-size: 17px; }
      .layout { gap: 14px; margin-top: 14px; }
      .tablecard { padding: 12px; border-radius: 14px; }
      .table-meta { margin-bottom: 8px; }
      .felt-wrap { padding-top: 106%; }      /* taller oval so 9 seats have room */
      .felt { inset: 7% 4%; border-width: 4px; }
      .felt::after { inset: 9px; }
      .seat { width: 72px; }
      .seat .avatar { width: 34px; height: 34px; font-size: 13px; margin-bottom: 3px; }
      .seat .nameplate { padding: 3px 5px; border-radius: 7px; }
      .seat .pname { font-size: 11px; }
      .seat .pbounty { font-size: 10px; min-height: 12px; }
      .seat .xmark { font-size: 30px; }
      .seat .badge { font-size: 9px; padding: 1px 5px; top: -6px; }
      .felt-center .pot-amt { font-size: 22px; }
      .felt-center .pot-label, .felt-center .pot-sub { font-size: 10px; }
      .envelope { width: 46px; height: 32px; }
      .env-amt { font-size: 12px; }
      .floataward { font-size: 13px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Mystery <span class="suit">&spades;</span> Bounty</div>
    </div>

    <div class="layout">
      <!-- left: the table -->
      <div class="tablecard">
        <div class="table-meta">
          <div class="tname">Day 2 &middot; <span id="tableName">Table 1</span></div>
          <div class="tag" id="statusTag">Final result</div>
        </div>

        <div class="felt-wrap" id="feltWrap">
          <div class="felt"></div>
          <div class="felt-center">
            <div class="pot-label">Bounties on this table</div>
            <div class="pot-amt" id="potAmt">$0</div>
            <div class="pot-sub" id="potSub">in sealed envelopes</div>
          </div>
          <!-- seats + envelopes injected here -->
        </div>

        <div class="replaybar">
          <button class="btn" id="btnReplay">↻ Replay</button>
        </div>
      </div>

      <!-- right: leaderboard -->
      <div class="side">
        <div class="panel">
          <h3>Bounty leaderboard</h3>
          <div id="leaderboard"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       PLACEHOLDER DATA — edit freely. This whole file is self-contained; no API.
       Seats are listed in seating order around the table. Events are the
       knockouts in the real order they happened (first bust -> last bust).
       On each event: `out` is X'd out at their seat, and an envelope appears at
       the seat of `by` (the player who busted them) and opens to reveal `amount`.
       ========================================================================= */
    var PLAYERS = [
      { id: 1, name: 'Maverick' },
      { id: 2, name: 'Viper' },
      { id: 3, name: 'Duchess' },
      { id: 4, name: 'Ghost' },
      { id: 5, name: 'Rook' },
      { id: 6, name: 'Saint' },
      { id: 7, name: 'Nyx' },
      { id: 8, name: 'Bishop' },
      { id: 9, name: 'Crane' }
    ];

    // amounts in millions. One jackpot (Ghost's bounty) in the mix.
    var EVENTS = [
      { out: 9, by: 2, amount: 15 },   // Viper busts Crane
      { out: 5, by: 8, amount: 25 },   // Bishop busts Rook
      { out: 6, by: 7, amount: 40 },   // Nyx busts Saint
      { out: 3, by: 1, amount: 20 },   // Maverick busts Duchess
      { out: 4, by: 7, amount: 120 },  // Nyx busts Ghost  (jackpot)
      { out: 8, by: 2, amount: 35 },   // Viper busts Bishop
      { out: 7, by: 1, amount: 55 },   // Maverick busts Nyx     -> Nyx finishes 3rd (advances)
      { out: 2, by: 1, amount: 90 }    // Maverick busts Viper    -> Viper 2nd (advances), Maverick wins
    ];

    // top N finishers advance to the final table (highlighted at the end)
    var ADVANCE_COUNT = 3;
    var PLACES = null;      // real recorded placings (live mode) -> drives badges
    var IS_FINAL = false;   // only the final table crowns a single winner

    /* ========================================================================= */

    // Live data: when opened as bounty-animation.html?table=<id> the placeholder
    // above is replaced with the real seats + knockouts for that table, pulled
    // from the API. Envelope amounts are only revealed once the table is complete.
    var API = '/mystery-bounty/api';
    var byId = {};
    var ENV_TOTAL = 0;
    function computeDerived() {
      byId = {};
      PLAYERS.forEach(function (p) { byId[p.id] = p; });
      ENV_TOTAL = EVENTS.reduce(function (a, e) { return a + e.amount; }, 0);
    }

    function initials(name) {
      var parts = String(name || '').trim().split(/\s+/);
      return ((parts[0] && parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }

    // player names come from the roster and are rendered via innerHTML, so escape
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    function money(m) {
      if (!m) return '$0';
      if (m >= 1000) return '$' + (m / 1000).toFixed(2).replace(/\.?0+$/, '') + 'B';
      return '$' + m + 'M';
    }

    // ----- build seats around the ellipse -----
    var feltWrap = document.getElementById('feltWrap');
    var seatEls = {};        // playerId -> seat element
    var seatPos = {};        // playerId -> {x,y} in %

    function radii() {
      // narrower, taller oval on small screens so 9 seats don't overlap
      return window.innerWidth < 640 ? { rx: 39, ry: 45 } : { rx: 46, ry: 42 };
    }

    function layoutSeats() {
      var n = PLAYERS.length, cx = 50, cy = 50, r = radii();
      PLAYERS.forEach(function (p, i) {
        var ang = (Math.PI / 2) + (i / n) * 2 * Math.PI;  // bottom-center, clockwise
        var x = cx + r.rx * Math.cos(ang);
        var y = cy + r.ry * Math.sin(ang);
        seatPos[p.id] = { x: x, y: y };
        seatEls[p.id].style.left = x + '%';
        seatEls[p.id].style.top = y + '%';
      });
    }

    function buildSeats() {
      PLAYERS.forEach(function (p) {
        var el = document.createElement('div');
        el.className = 'seat';
        el.innerHTML =
          '<div class="badge adv">Advances</div>' +
          '<div class="badge win">♛ Winner</div>' +
          '<div class="avatar">' + initials(p.name) +
          '<div class="xmark">✕</div></div>' +
          '<div class="nameplate">' +
          '<div class="pname">' + esc(p.name) + '</div>' +
          '<div class="pbounty empty" data-b="' + p.id + '">—</div>' +
          '</div>';
        feltWrap.appendChild(el);
        seatEls[p.id] = el;
      });
      layoutSeats();
      window.addEventListener('resize', layoutSeats);
    }

    // ----- leaderboard -----
    var bounties = {};  // playerId -> {cash, kos}
    PLAYERS.forEach(function (p) { bounties[p.id] = { cash: 0, kos: 0 }; });

    function renderLeaderboard(bumpId) {
      var rows = PLAYERS.map(function (p) {
        return { id: p.id, name: p.name, cash: bounties[p.id].cash, kos: bounties[p.id].kos };
      }).filter(function (r) { return r.cash > 0; })
        .sort(function (a, b) { return b.cash - a.cash; });

      var lb = document.getElementById('leaderboard');
      if (!rows.length) {
        lb.innerHTML = '<div class="note" style="margin:0">No bounties won yet.</div>';
        return;
      }
      lb.innerHTML = rows.map(function (r, i) {
        return '<div class="lb-row' + (r.id === bumpId ? ' bump' : '') + '">' +
          '<div class="rank">' + (i + 1) + '</div>' +
          '<div class="av">' + initials(r.name) + '</div>' +
          '<div class="nm">' + esc(r.name) + '<div class="ko-count">' + r.kos + ' KO' + (r.kos === 1 ? '' : 's') + '</div></div>' +
          '<div class="cash">' + money(r.cash) + '</div>' +
          '</div>';
      }).join('');
      if (bumpId) {
        setTimeout(function () {
          var el = lb.querySelector('.lb-row.bump');
          if (el) el.classList.remove('bump');
        }, 600);
      }
    }

    // ----- playback -----
    var step = 0;           // how many events have been applied
    var timer = null;
    var playing = false;
    var envList = {};       // playerId -> array of that player's envelope elements

    // lay a seat's envelopes out in a row, re-centred as each is added, placed
    // slightly inward from the seat so none covers another's amount.
    function layoutSeatEnvs(pid) {
      var list = envList[pid]; if (!list || !list.length) return;
      var pos = seatPos[pid];
      var bx = pos.x + (50 - pos.x) * 0.18;   // nudge toward table centre
      var by = pos.y + (50 - pos.y) * 0.18;
      var w = window.innerWidth < 640 ? 50 : 62;  // per-envelope slot width (px)
      var start = -((list.length - 1) * w) / 2;
      list.forEach(function (el, k) {
        el.style.left = 'calc(' + bx + '% + ' + (start + k * w) + 'px)';
        el.style.top = by + '%';
        el.style.zIndex = 20 + k;
      });
    }
    function relayoutAllEnvs() { Object.keys(envList).forEach(layoutSeatEnvs); }
    window.addEventListener('resize', relayoutAllEnvs);

    var btnReplay = document.getElementById('btnReplay');
    var statusTag = document.getElementById('statusTag');

    // reveal timeline for one knockout (ms, measured from the envelope appearing)
    var OPEN_AT = 700;     // flap starts opening
    var CREDIT_AT = 2850;  // amount is fully revealed -> credit the player
    var EVENT_GAP = 3050;  // next knockout starts right as this reveal finishes

    function reset() {
      stopAuto();
      step = 0;
      envList = {};
      PLAYERS.forEach(function (p) {
        bounties[p.id] = { cash: 0, kos: 0 };
        var el = seatEls[p.id];
        el.className = 'seat';
        var b = el.querySelector('.pbounty');
        b.textContent = '—'; b.classList.add('empty');
      });
      Array.prototype.forEach.call(feltWrap.querySelectorAll('.envelope,.floataward'), function (n) { n.remove(); });
      renderLeaderboard();
      updateChrome();
      btnReplay.hidden = true;
    }

    function updateChrome() {
      document.getElementById('potAmt').textContent = money(ENV_TOTAL);
      document.getElementById('potSub').textContent = (EVENTS.length - step) + ' envelopes sealed';
    }

    function applyEvent(ev) {
      // 1) X out the busted player
      seatEls[ev.out].classList.add('out');

      // 2) envelope appears at the seat of the player who busted them, then opens
      //    slowly. Envelopes stay put and spread in a row so none covers another.
      var env = document.createElement('div');
      env.className = 'envelope show';
      env.innerHTML =
        '<div class="env-body"><span class="env-amt">' + money(ev.amount) + '</span></div>' +
        '<div class="env-flap"></div>';
      feltWrap.appendChild(env);
      if (!envList[ev.by]) envList[ev.by] = [];
      envList[ev.by].push(env);
      layoutSeatEnvs(ev.by);

      setTimeout(function () { env.classList.add('open'); }, OPEN_AT);

      // credit the buster once the amount is fully revealed; float a +$ up
      setTimeout(function () {
        bounties[ev.by].cash += ev.amount;
        bounties[ev.by].kos += 1;
        var b = seatEls[ev.by].querySelector('.pbounty');
        b.textContent = money(bounties[ev.by].cash);
        b.classList.remove('empty');

        var rect = env.style;  // float from the envelope's current spot
        var fl = document.createElement('div');
        fl.className = 'floataward go';
        fl.style.left = rect.left;
        fl.style.top = rect.top;
        fl.textContent = '+' + money(ev.amount);
        feltWrap.appendChild(fl);
        setTimeout(function () { fl.remove(); }, 1400);

        renderLeaderboard(ev.by);
      }, CREDIT_AT);
    }

    function doStep() {
      if (step >= EVENTS.length) return;
      applyEvent(EVENTS[step]);
      step++;
      updateChrome();
      if (step >= EVENTS.length) setTimeout(finish, CREDIT_AT + 200);
    }

    function finish() {
      if (PLACES && PLACES.length) {
        // use the steward's real recorded placings
        PLACES.forEach(function (pl) {
          var el = seatEls[pl.tornId]; if (!el) return;
          if (IS_FINAL && pl.place === 1) el.classList.add('winner');
          else if (pl.advancedTo === 'final') el.classList.add('advance');
        });
      } else {
        // demo/placeholder fallback: survivors (winner first) then reverse bust order
        var bustOrder = EVENTS.map(function (e) { return e.out; });
        var survivors = PLAYERS.map(function (p) { return p.id; }).filter(function (id) { return bustOrder.indexOf(id) === -1; });
        survivors.concat(bustOrder.slice().reverse()).forEach(function (id, i) {
          var place = i + 1;
          if (place <= ADVANCE_COUNT) seatEls[id].classList.add('advance');
          if (place === 1) { seatEls[id].classList.add('winner'); seatEls[id].classList.remove('advance'); }
        });
      }
      statusTag.textContent = 'Final result';
      stopAuto();
      btnReplay.hidden = false;
    }

    // ----- auto play -----
    function playLoop() {
      if (step >= EVENTS.length) return;
      doStep();
      if (step < EVENTS.length) timer = setTimeout(playLoop, EVENT_GAP);
    }
    function startAuto() {
      playing = true;
      btnReplay.hidden = true;
      statusTag.textContent = 'Live';
      playLoop();
    }
    function stopAuto() {
      playing = false;
      if (timer) { clearTimeout(timer); timer = null; }
    }

    // ----- wire up -----
    btnReplay.addEventListener('click', function () { reset(); startAuto(); });

    function boot() {
      computeDerived();
      buildSeats();
      reset();
      if (EVENTS.length) setTimeout(startAuto, 700);  // auto-play on load
    }

    // If a ?table=<id> is present, load that table's real seats + knockouts.
    var tableId = new URLSearchParams(location.search).get('table');
    if (tableId) {
      document.getElementById('statusTag').textContent = 'Loading…';
      fetch(API + '/table?id=' + encodeURIComponent(tableId))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error || !d.table) { notice('Table not found.'); return; }
          document.getElementById('tableName').textContent = d.table.label || d.table.id;
          PLAYERS = (d.seats || []).map(function (s) { return { id: s.tornId, name: s.name || ('#' + s.tornId) }; });
          if (!PLAYERS.length) { notice('No players seated at this table yet.'); return; }
          if (!d.complete) {
            EVENTS = [];
            computeDerived(); buildSeats(); reset();
            document.getElementById('statusTag').textContent = 'In progress';
            document.getElementById('potSub').textContent = 'replay unlocks when the table finishes';
            return;
          }
          // amounts come back in dollars; the animation works in millions
          EVENTS = (d.knockouts || []).map(function (k) { return { out: k.out, by: k.by, amount: Math.round((k.amount || 0) / 1e6) }; });
          PLACES = d.places || [];
          IS_FINAL = d.table.stage === 'final';
          var adv = PLACES.filter(function (p) { return p.advancedTo === 'final'; }).length;
          ADVANCE_COUNT = adv || (IS_FINAL ? 1 : 3);
          boot();
        })
        .catch(function () { notice('Could not load this table.'); });
    } else {
      boot();  // placeholder demo
    }

    function notice(msg) {
      document.getElementById('statusTag').textContent = 'Unavailable';
      document.getElementById('potAmt').textContent = '—';
      document.getElementById('potSub').textContent = msg;
    }
  </script>
</body>

</html>
